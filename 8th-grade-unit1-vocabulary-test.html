<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sümeyye Oğultekin | Sümeyye Oğultekin | Unit 1 Vocabulary Test</title>
<style>
:root{--bg:#eef6f3;--card:#fff;--ink:#17332c;--mut:#5d7a72;--g:#0b7a63;--line:#cfe3dc;--opt:#f3f8f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172622;--ink:#e6f4ef;--mut:#92b3a9;--line:#2a443d;--opt:#1e302b}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172622;--ink:#e6f4ef;--mut:#92b3a9;--line:#2a443d;--opt:#1e302b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.br{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:.5px}.br img{width:52px;height:52px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.3)}.br small{display:block;font-weight:500;font-size:11.5px;opacity:.9;letter-spacing:0}.tt{text-align:center}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header small{display:block;opacity:.85;font-size:12px}
.st{display:flex;gap:10px;align-items:center;font-weight:700}
.st span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px}
#rst{border:0;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;background:#fff;color:var(--g)}
#ns{max-width:760px;margin:12px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
#ns button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;padding:0}
#ns .cur{border-color:var(--g);box-shadow:0 0 0 2px var(--g)}#ns .dn{background:#1fa76a;border-color:#1fa76a;color:#fff}#ns .wg{background:#ffe0e0;border-color:#e5383b;color:#600}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.q.ok{border-color:#1fa76a}
.no{color:var(--mut);font-weight:700}
.q h2{margin:10px 0 16px;font-size:clamp(28px,6vw,44px);display:flex;align-items:center;gap:12px;color:var(--g)}
.sp{width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:26px;cursor:pointer;flex:none}
.os{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.os{grid-template-columns:1fr}}
.o{font:inherit;font-size:clamp(16px,3.6vw,20px);text-align:left;border:2px solid var(--line);background:var(--opt);color:var(--ink);border-radius:12px;padding:14px;cursor:pointer;transition:.12s}
.o b{color:var(--g);margin-right:6px}
.o:hover:not(:disabled){border-color:var(--g);transform:translateY(-1px)}
.o.good{background:#1fa76a;border-color:#1fa76a;color:#fff}.o.good b{color:#fff}
.o.bad{background:#e5383b;border-color:#e5383b;color:#fff;animation:sh .35s}.o.bad b{color:#fff}
.o:disabled{cursor:default}
.nv{display:flex;justify-content:space-between;margin-top:16px}
.nv button{border:0;border-radius:99px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:#7a7f99}.nv button:disabled{opacity:.35;cursor:default}
body:not(.go) #fin{display:none}
#start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}.go #start{display:none}
#start div{background:var(--card);border-radius:20px;padding:28px;max-width:440px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#start h2{color:var(--g);margin:0 0 8px}#start button{margin-top:14px;border:0;border-radius:99px;padding:14px 32px;font:inherit;font-size:19px;font-weight:800;color:#fff;background:var(--g);cursor:pointer}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fs{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;cursor:pointer}
#fs.on{display:flex;animation:fi .25s}
#fs.g{background:rgba(31,167,106,.93)}#fs.r{background:rgba(229,56,59,.93)}
#fs svg{width:min(70vmin,520px);height:min(70vmin,520px);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
#sc{background:#ffd23f!important;color:#3a2d00;font-size:18px}
#fin{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:99px;padding:14px 26px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;color:#fff;background:#e5383b;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:.15s}
#fin:hover{transform:scale(1.06)}
#res{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,25,20,.72);padding:16px}#res.on{display:flex}
#rc{background:var(--card);color:var(--ink);border-radius:18px;padding:22px;width:min(100%,420px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
#rc h2{margin:0 0 10px;text-align:center;color:var(--g)}
.rw{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.rw.g b{color:#1fa76a}.rw.r b{color:#e5383b}
.tot{text-align:center;margin-top:12px;color:var(--mut)}.tot strong{display:block;font-size:56px;color:var(--g);line-height:1.1}
#rc p{text-align:center;margin:8px 0 14px}
.rbt{display:flex;gap:8px;justify-content:center}.rbt button{border:0;border-radius:99px;padding:9px 18px;font-weight:700;cursor:pointer;color:#fff;background:var(--g)}.rbt button+button{background:#7a7f99}
#ft{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--g);text-align:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));font-size:13px;font-weight:700}#ft a{color:#fff;text-decoration:none;letter-spacing:.3px}
@media(max-width:520px){#fin{padding:9px 16px;font-size:14px}.st{gap:6px}.st span,#rst{white-space:nowrap;font-size:13px;padding:4px 9px}#sc{font-size:15px}#ns button{width:26px;height:26px;font-size:11px}#ns{margin-top:8px}.q{padding:12px}.q h2{margin:4px 0 10px}.sp{width:44px;height:44px;font-size:20px}.o{padding:10px 12px}.os{gap:7px}.nv{margin-top:10px}main{padding:10px 12px 100px}}
.qt{cursor:pointer;margin:14px 0 16px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-style:italic;font-size:14px}.qt b{display:block;margin-top:6px;font-style:normal;font-size:12px;letter-spacing:.8px;color:var(--g)}
.ad2{display:block;text-align:center;margin-top:12px;font-size:clamp(11px,2.6vw,13px);font-weight:600;color:var(--mut);text-decoration:none;letter-spacing:.3px}
.ad{font-size:12px;color:var(--mut);font-weight:700;margin:14px 0 0!important}
#wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;user-select:none;white-space:nowrap;font-weight:800;font-size:clamp(20px,5.2vw,64px);letter-spacing:.5px;color:var(--g);opacity:.16;text-align:center}
</style></head><body>

let ap=null,pend=null,buf={};
const b2b=u=>{const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer};
function ld(k,u){return buf[k]||(buf[k]=new Promise((res,rej)=>{try{const p=ctx().decodeAudioData(b2b(u),res,rej);if(p&&p.catch)p.catch(rej)}catch(e){rej(e)}}))}
function playBuf(k,u,maxSec,fade){
  const h={paused:false,ended:false,cancel:false,s:null};
  ld(k,u).then(b=>{
    if(h.cancel)return;
    const a=ctx(),s=a.createBufferSource(),g=a.createGain(),t=a.currentTime+.02,d=Math.min(maxSec,b.duration);
    s.buffer=b;s.connect(g);g.connect(a.destination);
    if(d<b.duration&&fade>0){g.gain.setValueAtTime(1,t+d-fade);g.gain.linearRampToValueAtTime(0,t+d)}
    s.onended=()=>{h.ended=true;h.paused=true};h.s=s;s.start(t,0,d);
  }).catch(()=>{h.ended=true;h.paused=true});
  return h;
}
function killBuf(h){if(!h)return;h.cancel=true;h.paused=true;try{h.s&&h.s.stop()}catch(e){}}
function stopAp(){clearInterval(pend);killBuf(ap);ap=null}
function applause(){stopAp();ap=playBuf('ap',APSRC,6,.3)}
function buzzer(){stopAp();
  try{
    const a=ctx(),t=a.currentTime+.01,g=a.createGain();g.connect(a.destination);
    g.gain.setValueAtTime(.0001,t);
    [[330,0],[220,.3]].forEach(([f,o])=>{
      const s=a.createOscillator();s.type='sawtooth';s.frequency.value=f;
      const e=a.createGain();e.gain.setValueAtTime(.0001,t+o);e.gain.linearRampToValueAtTime(.5,t+o+.02);e.gain.setValueAtTime(.5,t+o+.24);e.gain.linearRampToValueAtTime(.0001,t+o+.28);
      s.connect(e);e.connect(a.destination);s.start(t+o);s.stop(t+o+.3);
    });
  }catch(e){}
}
let nxt=null;
function hideFs(){clearTimeout(tm);$('fs').className='';if(nxt){const f=nxt;nxt=null;f()}}
function flash(ok){
  const f=$('fs');clearTimeout(tm);f.className='on '+(ok?'g':'r');f.innerHTML=ok?TICK:CROSS;
  nxt=ok&&cur<Q.length-1?()=>render(cur+1,'wait'):null;
  tm=setTimeout(hideFs,2000);
}
$('fs').onclick=hideFs;
